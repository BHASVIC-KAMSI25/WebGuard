
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebGuard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>WebGuard</h1>
        <p>Website Security Scanner</p>
    </header>

    <main>

        <section class="scanner">

            <h2>Scan a Website</h2>

            <div class="scan-input">

                <div class="url-input">
                    <span>https://</span>

                    <input
                        type="text"
                        id="urlInput"
                        placeholder="example.com"
                    >
                </div>

                <button id="scanButton">
                    Scan Website
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
